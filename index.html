<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登録</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.24.0/sdk.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    text-align: center;
    padding: 40px 20px;
    color: #333;
  }
  .msg { font-size: 16px; margin-top: 20px; line-height: 1.6; }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto;
    border: 4px solid #eee; border-top: 4px solid #06C755;
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ok { color: #06C755; font-weight: bold; }
  .err { color: #e74c3c; font-weight: bold; }
</style>
</head>
<body>

  <div id="spinner" class="spinner"></div>
  <p id="message" class="msg">登録処理中です…</p>

<script>
  // ▼ 設定項目 ▼
  const LIFF_ID = "2010898635-Chwg9aiE";                 // LINE Developersで発行したLIFF ID
  const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbwxxx5mOpbQZnFjLyiQqe3BLukI33qltS2nccNhoDbgIz-ZTzfwlW50dJGh2aB9XJAx/exec";     // Code.gs をデプロイしたWebアプリURL(doPost用)
  // ▲ 設定項目 ▲

  function showMessage(text, isError) {
    document.getElementById("spinner").style.display = "none";
    const el = document.getElementById("message");
    el.textContent = text;
    el.className = "msg " + (isError ? "err" : "ok");
  }

  function setStatus(text) {
    document.getElementById("message").textContent = text;
  }

  // 指定時間内にpromiseが終わらなければタイムアウトさせるヘルパー
  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error("timeout:" + label)), ms)
      )
    ]);
  }

  // liff.line.meを経由すると、LINEが自動付与する"liff.state"パラメータに
  // こちらのcidが巻き込まれて消える/読めなくなることがあるため、
  // liff.state部分を取り除いた上でcidを取得する
  function getCid() {
    const rawSearch = window.location.search;
    if (rawSearch.includes("liff.state=")) {
      const decoded = decodeURIComponent(rawSearch);
      const idx = decoded.indexOf("liff.state=");
      let rest = decoded.substring(idx + "liff.state=".length);
      if (rest.startsWith("?")) rest = rest.substring(1);
      const queries = new URLSearchParams(rest);
      const cidFromState = queries.get("cid");
      if (cidFromState) return cidFromState;
    }
    return new URLSearchParams(rawSearch).get("cid");
  }

  async function main() {
    const cid = getCid(); // kintoneのレコード番号

    if (!cid) {
      showMessage("リンクが正しくありません。担当者にご連絡ください。", true);
      return;
    }

    try {
      setStatus("LIFF初期化中…(cid=" + cid + ")");
      await withTimeout(liff.init({ liffId: LIFF_ID }), 10000, "liff.init");

      if (!liff.isLoggedIn()) {
        setStatus("ログインへ移動します…");
        liff.login();
        return; // ログイン後にリダイレクトされ再度main()が走る
      }

      setStatus("プロフィール取得中…");
      const profile = await withTimeout(liff.getProfile(), 10000, "getProfile");

      setStatus("サーバーへ送信中…");
      const sendUrl = GAS_ENDPOINT
        + "?cid=" + encodeURIComponent(cid)
        + "&userId=" + encodeURIComponent(profile.userId)
        + "&displayName=" + encodeURIComponent(profile.displayName || "");

      // fetch/imgでのバックグラウンド送信がこの環境(LINEアプリ内ブラウザ)では
      // 一切GASに届かないことが確認できたため、確実に届くページ全体の遷移で送信する。
      // 完了後の見た目はGAS側(doGet)が返すHTMLで整える。
      window.location.href = sendUrl;
      return; // 以降は遷移先のページで完結する
    } catch (e) {
      showMessage("エラーが発生しました(" + e.message + ")。担当者にご連絡ください。", true);
      console.error(e);
    }
  }

  main();
</script>
</body>
</html>
